# examples/overrides/swiftpay.yml — закрывает WARN спеки SwiftPay, которые можно закрыть настройкой.
# Остаются 2 UNSUPPORTED (внешний $ref, oauth2 как альтернативная схема) — они требуют ручного кода.

statuses:
  PENDING_APPROVAL: in_progress
  RETURNED: rejected

webhook:
  signature_scheme: timestamped               # WARN signature_timestamped: подтверждаем t=<ts>,v1=<hmac> из описания

fields:
  beneficiary:
    variant: IbanBeneficiary                  # WARN one_of_first_variant: явный выбор варианта oneOf
  beneficiary.address:
    source: "{ country: operation.payout_requisite.dig('bank_account', 'country') }.compact"

# endpoints:
#   cancelOutboundPayment: other                # если не хотим генерировать cancel_request через DELETE
