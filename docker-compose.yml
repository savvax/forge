# Веб-интерфейс forge: docker compose up --build → http://localhost:8080
services:
  forge-web:
    build:
      context: .
      target: web
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      FORGE_WORKDIR: /data/web
      RACK_ENV: production
    volumes:
      - forge-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:8080/')).code == '200' ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  forge-data:
