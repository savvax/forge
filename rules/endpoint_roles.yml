# Роли эндпоинтов (docs/RULES.md § 2). Слова ищутся в path-сегментах, operationId, summary, tags
# после нормализации (camelCase/-/. → snake_case, затем разбиение на токены по `_`).
payout_words: [payout, payouts, withdraw, withdrawal, withdrawals, transfer, transfers, disburse,
               disbursement, disbursements, send, remittance, outbound]
# Слабые слова: считаются словами выплаты, только если ни один путь спеки не содержит сильного слова.
# Если сильные слова есть, create-кандидат на пути без них (/v2/payments, /v2/bank-accounts у Square) получает
# штраф negative_penalty: спека сама назвала ресурс выплат, и создание выплаты живёт на нём.
weak_payout_words: [payment, payments]
negative_words: [order, orders, inventory, subscription, subscriptions, booking, bookings, invoice,
                 invoices, terminal, loyalty, climate, test_helpers, refund, refunds, recipient,
                 recipients, otp, export, bulk, search, resend, finalize, authorization, authorize,
                 auth, login, logout, token, tokens, connection, connections, session, sessions, phone_code,
                 send_phone, verify_phone, settings, callback_settings, draft, banks, dictionary,
                 simulate, simulation, inward, incoming, payin, deposit, deposits, health,
                 calculate, estimate, validate, preview, link, links, methods]   # песочница, входящие платежи, health-check,
                                                                       # расчёт/проверка, платёжные ссылки (pay-in) — не выплата
negative_penalty: 0.5   # больше веса payout_word_in_path + create_word: /v2/transfer-orders не проходит порог warn

words:
  create: [create, new, submit, send, initiate, make, register, request, post]
  status: [status, get, retrieve, fetch, info, details, show, verify, check]
  cancel: [cancel, void, revoke, abort, stop]
  webhook: [webhook, webhooks, callback, callbacks, notify, notification, notifications, ipn, events]
  balance: [balance, balances, funds]   # account/wallet давали /account_numbers и /accountHolders
  signature: [sign, signature, hmac, digest]
  id: [id, code, reference]

roles:
  create:
    requires: { all: [has_request_body] }
    signals:
      method_post: 0.30
      payout_word_in_path: 0.25
      create_word: 0.20
      no_path_param: 0.10
      has_request_body: 0.10
      has_path_param: -0.25        # POST /x/{id}/… — действие над существующим объектом, не создание выплаты
  status:
    requires: { any: [has_path_param, id_query_param, id_body_field] }
    signals:
      method_get: 0.30
      payout_word_in_path: 0.25
      has_path_param: 0.20
      status_word: 0.15
      id_body_field: 0.30          # POST /transfer/get с {transfer_id} в теле (Plaid-стиль)
      method_post_with_id_body: 0.10
      array_response: -0.40        # 2xx возвращает массив — это список, статус одной выплаты так не отдают
      multi_path_param: -0.30      # /client/{c}/wallet/{w}/… — из operation берётся только один id
  cancel:
    requires: { any: [has_path_param, has_request_body] }
    signals:
      method_post_or_delete: 0.25
      method_delete: 0.20            # REST: DELETE /resource/{id} — отмена без слова cancel в пути
      payout_word_in_path: 0.20
      cancel_word_in_path: 0.30
      cancel_word_in_operation: 0.10
      has_path_param: 0.10
      multi_path_param: -0.30
  webhook:
    signals:
      webhook_word_in_path: 0.40
      security_explicitly_empty: 0.20
      signature_header_param: 0.20
      method_post: 0.10
    explicit_sources_confidence: 0.95
  balance:
    signals:
      balance_word_in_path: 0.50
      method_get: 0.25
      no_path_param: 0.10
      array_response: -0.40        # список (GET /account_transfers) — не баланс
